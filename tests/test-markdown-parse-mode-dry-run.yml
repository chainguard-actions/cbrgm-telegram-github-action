name: Test dry-run with markdown parse mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with markdown parse mode in dry-run mode
        id: action
        uses: .
        with:
          token: "fake-token-for-dry-run"
          to: "123456789"
          message: "*Bold* and _italic_ text"
          parse-mode: "markdown"
          dry-run: "true"
      - name: Assert action completed successfully
        run: |
          echo "Action completed with markdown parse mode in dry-run mode"
          echo "PASS: action ran without error"
