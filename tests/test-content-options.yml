name: Test dry-run with content protection options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with content options in dry-run
        id: action
        uses: .
        with:
          token: "fake-token-for-dry-run"
          to: "123456789"
          message: "Check out https://example.com for more info"
          disable-web-page-preview: "true"
          protect-content: "true"
          dry-run: "true"
      - name: Assert action completed successfully
        run: |
          echo "Action completed with content protection options in dry-run mode"
          echo "PASS: action ran without error"
