name: Test dry-run with HTML parse mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: "fake-token-for-dry-run"
          to: "111222333"
          message: "<b>Bold</b> and <i>italic</i> via HTML"
          parse-mode: "html"
          disable-notification: "false"
          dry-run: "true"
      - name: Assert action completed without error
        run: |
          echo "Action completed successfully in dry-run mode with HTML parse mode"
          echo "PASS"
