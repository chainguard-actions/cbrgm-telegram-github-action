name: Test optional parameters in dry-run mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: "fake-token-dry-run"
          to: "123456789"
          message: "Test message with optional params"
          parse-mode: "html"
          disable-web-page-preview: "true"
          disable-notification: "true"
          protect-content: "true"
          dry-run: "true"
      - name: Assert action completed successfully with optional params
        run: |
          echo "Action completed in dry-run mode with optional parameters"
          echo "PASS: dry-run with optional params succeeded"
