name: Test optional parameters in dry-run mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with optional parameters in dry-run mode
        id: action
        uses: .
        with:
          token: "fake-token-for-dry-run"
          to: "987654321"
          message: "*Bold* message with [link](https://example.com)"
          parse-mode: "markdown"
          disable-web-page-preview: "true"
          disable-notification: "true"
          protect-content: "true"
          dry-run: "true"
      - name: Assert action completed successfully with optional params
        run: |
          echo "Action completed without error using optional parameters in dry-run mode"
          echo "PASS"
