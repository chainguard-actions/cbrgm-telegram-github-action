name: Test thread-id input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: "fake-token"
          to: "123456789"
          thread-id: "42"
          message: "Hello from thread-id test"
          dry-run: "true"
      - name: Assert dry-run completed without error
        run: |
          echo "PASS: action completed with thread-id input set"
