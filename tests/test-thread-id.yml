name: Test thread-id input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: "fake-token-for-dry-run"
          to: "123456789"
          thread-id: "42"
          message: "Test message with thread-id"
          dry-run: "true"
        continue-on-error: true
      - name: Assert action ran with thread-id input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded in dry-run mode with thread-id"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (may fail gracefully with fake token in dry-run)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
