name: Test basic dry-run message
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: "fake-token-dry-run"
          to: "123456789"
          message: "Hello from GitHub Actions dry-run test!"
          dry-run: "true"
      - name: Assert action completed successfully
        run: |
          echo "Action completed in dry-run mode"
          echo "PASS: dry-run message step succeeded"
