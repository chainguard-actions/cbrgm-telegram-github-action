name: Test parse-mode HTML
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Send HTML-formatted message in dry-run mode
        id: action
        uses: .
        with:
          token: "fake-token-for-dry-run"
          to: "123456789"
          message: "<b>Bold</b> and <i>italic</i> text"
          parse-mode: "html"
          dry-run: "true"
      - name: Assert action completed successfully
        run: |
          echo "Action completed without error with parse-mode=html in dry-run mode"
          echo "PASS"
