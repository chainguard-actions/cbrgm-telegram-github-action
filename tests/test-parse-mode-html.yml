name: Test parse mode HTML
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: "fake-token-for-dry-run"
          to: "123456789"
          message: "<b>Bold</b> message with <i>HTML</i> formatting"
          parse-mode: "html"
          dry-run: "true"
      - name: Assert action completed with html parse mode
        run: |
          echo "PASS: action completed in dry-run mode with html parse-mode"
