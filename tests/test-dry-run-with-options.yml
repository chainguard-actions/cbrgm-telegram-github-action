name: Test dry-run with notification and preview options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"
      - id: action
        uses: .
        with:
          token: "fake-token-for-dry-run"
          to: "987654321"
          message: "Silent message with no preview and protected content"
          disable-notification: "true"
          disable-web-page-preview: "true"
          protect-content: "true"
          dry-run: "true"
      - name: Assert action completed successfully
        run: |
          echo "Action completed in dry-run mode with options without error"
          echo "PASS"
