name: Test dry-run with notification and preview options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Send message with options in dry-run mode
        id: action
        uses: .
        with:
          token: "fake-token-for-dry-run"
          to: "987654321"
          message: "Silent message with no preview and protected content"
          disable-notification: "true"
          disable-web-page-preview: "true"
          protect-content: "true"
          dry-run: "true"
      - name: Assert action completed successfully
        run: |
          echo "Action completed without error in dry-run mode with options"
          echo "PASS"
