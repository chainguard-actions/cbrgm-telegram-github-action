name: Test media with thread-id (dry-run)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: "fake-token-for-dry-run"
          to: "123456789"
          thread-id: "42"
          message: "Test message with media"
          media: "https://example.com/image.png"
          media-type: "photo"
          dry-run: "true"
      - name: Assert dry-run completed successfully
        run: |
          echo "Action completed in dry-run mode with media, media-type, and thread-id inputs"
          echo "PASS"
