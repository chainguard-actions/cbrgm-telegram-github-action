name: Test dry-run with silent and protected content options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Send silent protected message in dry-run mode
        id: action
        uses: .
        with:
          token: "fake-token-for-dry-run"
          to: "987654321"
          message: "Silent protected message test"
          disable-notification: "true"
          protect-content: "true"
          disable-web-page-preview: "true"
          dry-run: "true"
      - name: Assert action completed successfully
        run: |
          echo "Action completed with silent+protected options in dry-run mode"
          echo "PASS: action ran without error"
