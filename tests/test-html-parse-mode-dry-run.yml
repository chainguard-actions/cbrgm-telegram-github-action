name: Test HTML parse mode in dry-run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with HTML parse mode in dry-run mode
        id: action
        uses: .
        with:
          token: "fake-token-for-dry-run"
          to: "111222333"
          message: "<b>Bold</b> message with <a href=\"https://example.com\">link</a>"
          parse-mode: "html"
          dry-run: "true"
      - name: Assert action completed successfully with HTML parse mode
        run: |
          echo "Action completed without error using HTML parse mode in dry-run mode"
          echo "PASS"
