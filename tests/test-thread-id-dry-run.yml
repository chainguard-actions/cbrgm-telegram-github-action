name: Test thread-id input (dry-run)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: "fake-token-for-dry-run"
          to: "123456789"
          thread-id: "42"
          message: "Test message with thread-id"
          dry-run: "true"
      - name: Assert dry-run completed without error
        run: |
          echo "PASS: action completed successfully with thread-id input"
