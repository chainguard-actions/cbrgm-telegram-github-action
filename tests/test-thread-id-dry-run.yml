name: Test thread-id input (dry-run)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Send message with thread-id (dry-run)
        id: action
        uses: .
        with:
          token: "fake-token"
          to: "123456789"
          thread-id: "42"
          message: "Test message with thread-id"
          dry-run: "true"
      - name: Assert dry-run succeeded
        run: |
          echo "PASS: action completed with thread-id set in dry-run mode"
