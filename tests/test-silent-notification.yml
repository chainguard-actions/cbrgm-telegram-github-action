name: Test silent notification dry-run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Send silent message in dry-run mode
        id: action
        uses: .
        with:
          token: "fake-token-for-dry-run"
          to: "123456789"
          message: "This is a silent notification"
          disable-notification: "true"
          dry-run: "true"
      - name: Assert action completed without error
        run: |
          echo "Action completed successfully with disable-notification in dry-run mode"
          echo "PASS"
