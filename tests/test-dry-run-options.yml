name: Test dry-run with custom options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: "fake-token-for-dry-run"
          to: "987654321"
          message: "Test message with *bold* and _italic_ text"
          parse-mode: "markdown"
          disable-web-page-preview: "true"
          disable-notification: "true"
          protect-content: "true"
          dry-run: "true"
      - name: Assert action completed without error
        run: |
          echo "Action completed successfully in dry-run mode with custom options"
          echo "PASS"
