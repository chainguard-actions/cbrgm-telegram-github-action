name: Test media photo dry-run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Send photo media in dry-run mode
        id: action
        uses: .
        with:
          token: "fake-token-for-dry-run"
          to: "123456789"
          message: "Here is a photo caption"
          media: "https://example.com/photo.jpg"
          media-type: "photo"
          dry-run: "true"
      - name: Assert action completed without error
        run: |
          echo "Action completed successfully with media photo in dry-run mode"
          echo "PASS"
