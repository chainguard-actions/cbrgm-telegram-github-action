name: Test disable notification
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: "fake-token-for-dry-run"
          to: "123456789"
          message: "Silent notification test"
          disable-notification: "true"
          dry-run: "true"
      - name: Assert action completed with disable-notification
        run: |
          echo "PASS: action completed in dry-run mode with disable-notification=true"
